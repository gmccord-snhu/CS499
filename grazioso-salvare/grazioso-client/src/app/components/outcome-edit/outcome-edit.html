<div class="edit-page">
  <div class="edit-card">
    <div class="edit-header">
      <h2>Edit Outcome</h2>
      <p>Update the selected animal outcome record.</p>
    </div>

    <div *ngIf="isLoading" class="loading-state">
      Loading...
    </div>

    <form *ngIf="!isLoading && outcome" (ngSubmit)="updateOutcome()" class="edit-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input id="name" [(ngModel)]="outcome.Name" name="Name" />
      </div>

      <div class="form-group">
        <label for="type">Type</label>
        <input id="type" [(ngModel)]="outcome.Type" name="Type" />
      </div>

      <div class="form-group">
        <label for="sex">Sex</label>
        <input id="sex" [(ngModel)]="outcome.Sex" name="Sex" />
      </div>

      <div class="form-group">
        <label for="breed">Primary Breed</label>
        <input id="breed" [(ngModel)]="outcome['Primary Breed']" name="PrimaryBreed" />
      </div>

      <div class="form-group">
        <label for="color">Primary Color</label>
        <input id="color" [(ngModel)]="outcome['Primary Color']" name="PrimaryColor" />
      </div>

      <div class="form-group">
        <label for="secondaryColor">Secondary Color</label>
        <input
            id="secondaryColor"
            [(ngModel)]="outcome['Secondary Color']"
            name="SecondaryColor"/>
      </div>

      <div class="form-group">
        <label for="status">Outcome Status</label>
        <select id="status" [(ngModel)]="outcome['Outcome Status']" name="OutcomeStatus">
          <option>Adopted</option>
          <option>Transfer Out</option>
          <option>Reclaimed</option>
          <option>Euthanized</option>
          <option>Return to Habitat</option>
          <option>DOA</option>
        </select>
      </div>

      <div class="button-row">
        <button type="submit" class="save-btn">Save Changes</button>
        <button type="button" class="cancel-btn" (click)="goBack()">Cancel</button>
      </div>
    </form>
  </div>
</div>
