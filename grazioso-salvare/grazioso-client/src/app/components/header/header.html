<header class="header">
  <div class="header-grid">
    <div class="logo-section">
      <img
        src="assets/grazioso_salvare_logo.png"
        alt="Grazioso Salvare Logo"
        class="logo"
      />
    </div>

    <div class="hero-section">
      <img
        src="assets/dog_rescue.jpg"
        alt="Dog rescue"
        class="hero-image"
      />
    </div>

    <div class="right-section">

      <div class="top-row">
        <div class="title-row">
          <h1>Grazioso Salvare Dashboard</h1>
          <p>Animal Outcomes & Rescue Classification</p>
        </div>

        <div class="auth-row">
          <div *ngIf="!auth.isAdmin" class="login-form">
            <input [(ngModel)]="username" name="username" placeholder="Username" />
            <input [(ngModel)]="password" name="password" type="password" placeholder="Password" />
            <button type="button" (click)="login()">Login</button>

            <div *ngIf="loginError" class="login-error">
              {{ loginError }}
            </div>
          </div>

          <div *ngIf="auth.isAdmin" class="admin-info">
            <span>Admin</span>
            <button (click)="logout()">Logout</button>
          </div>
        </div>
      </div>

      <div class="controls-row">
        <label for="rescueType">Select Rescue Type:</label>
        <select id="rescueType" (change)="onRescueTypeChange($event)">
          <option value="">All Animals</option>
          <option value="WATER">Water Rescue</option>
          <option value="MOUNTAIN">Mountain Rescue</option>
          <option value="DISASTER">Disaster Rescue</option>
        </select>
      </div>

      <div class="controls-row">
        <label for="animalIdSearch">Find Animal ID:</label>
        <input
          id="animalIdSearch"
          type="text"
          [(ngModel)]="animalIdSearch"
          (input)="onSearchInputChange()"
          placeholder="Enter ID"
        />
        <button (click)="findAnimalById()">Find</button>
      </div>

      <div *ngIf="searchError" class="search-error">
        {{ searchError }}
      </div>

    </div>
  </div>
</header>
